<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16140f">
<title>Raya — Brief</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Raya Brief">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Saira+Condensed:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:oklch(0.165 0.012 72);--card:oklch(0.205 0.013 74);--tile:oklch(0.150 0.011 72);
    --ink:oklch(0.95 0.012 88);--mute:oklch(0.66 0.012 82);--faint:oklch(0.52 0.010 80);
    --line:oklch(0.30 0.009 76);--acc:oklch(0.80 0.105 86);--acc-d:oklch(0.62 0.085 82);
    --over:oklch(0.76 0.10 152);--under:oklch(0.72 0.13 34);
  }
  html,body{background:oklch(0.125 0.010 72);min-height:100%;-webkit-font-smoothing:antialiased}
  body{display:flex;justify-content:center;padding:max(18px,env(safe-area-inset-top)) 14px 26px;
    font-family:'Hanken Grotesk',system-ui,sans-serif;color:var(--ink)}
  .wrap{width:446px;max-width:100%}

  .auth{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:40px 28px;text-align:center;margin-top:8vh}
  .auth .mark{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:52px;letter-spacing:.05em;color:var(--acc);line-height:.9;text-transform:uppercase}
  .auth .tag{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-top:8px}
  .auth p{color:var(--mute);font-size:14px;margin:22px 0 18px;line-height:1.5}
  .auth input{width:100%;background:var(--tile);border:1px solid var(--line);border-radius:10px;
    padding:13px 14px;color:var(--ink);font-size:15px;font-family:inherit;outline:none}
  .auth input:focus{border-color:var(--acc-d)}
  .auth button{width:100%;margin-top:11px;background:var(--acc);color:oklch(0.165 0.012 72);border:none;
    border-radius:10px;padding:13px;font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:16px;
    letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .auth button:disabled{opacity:.5;cursor:default}
  .auth input+input{margin-top:9px}
  .auth .switch{margin-top:15px;font-size:13px;color:var(--mute)}
  .auth .switch a{color:var(--acc-d);cursor:pointer;text-decoration:none;font-weight:600}
  .auth .msg{margin-top:16px;font-size:13px;min-height:18px;line-height:1.45}
  .auth .msg.ok{color:var(--over)}.auth .msg.err{color:var(--under)}

  .bct{background:var(--bg);border-radius:16px;padding:26px 26px 22px;display:flex;flex-direction:column}
  .bct-hdr{display:flex;align-items:center;gap:13px;padding-bottom:16px;margin-bottom:18px;border-bottom:2px solid var(--line);position:relative}
  .bct-hdr::after{content:'';position:absolute;left:0;bottom:-2px;width:84px;height:2px;background:var(--acc)}
  .bct-bars{display:flex;gap:3px;align-items:center}
  .bct-bars i{width:5px;height:26px;background:var(--acc);border-radius:1px;transform:skewX(-12deg)}
  .bct-bars i:nth-child(2){height:20px;opacity:.6}.bct-bars i:nth-child(3){height:14px;opacity:.35}
  .bct-logo{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:38px;letter-spacing:.04em;line-height:.9;text-transform:uppercase}
  .bct-meta{margin-left:auto;text-align:right;line-height:1.35}
  .bct-meta b{display:block;font-family:'Saira Condensed',sans-serif;font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase}
  .bct-meta span{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}

  /* ── tabs (added) ─────────────────────────── */
  .tabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
  .tab{flex:1 1 calc(50% - 4px);text-align:center;background:var(--tile);border:1px solid var(--line);border-radius:11px;padding:10px;
    font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--mute);cursor:pointer}
  .tab.on{background:var(--acc);color:oklch(0.165 0.012 72);border-color:var(--acc)}
  .subtabs{display:flex;gap:7px;margin-bottom:13px}
  .subtab{flex:1;text-align:center;background:transparent;border:1px solid var(--line);border-radius:9px;padding:7px;
    font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);cursor:pointer}
  .subtab.on{border-color:var(--acc-d);color:var(--acc)}

  .bct-list{display:flex;flex-direction:column;gap:11px}
  .bct-card{display:grid;grid-template-columns:58px 1fr;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
  .bct-rail{background:linear-gradient(160deg,var(--card),var(--tile));position:relative;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line)}
  .bct-rail::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc)}
  .bct-rank{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:38px;line-height:.85;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .bct-rank b{display:block;font-size:8px;font-weight:700;letter-spacing:.18em;color:var(--faint);text-align:center;margin-bottom:3px}
  .bct-main{padding:13px 15px 14px;min-width:0}
  .bct-name{font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:25px;line-height:.98;text-transform:uppercase;letter-spacing:.01em}
  .bct-match{font-family:'Saira Condensed',sans-serif;font-weight:500;font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;margin-top:1px}
  .bct-bet{display:flex;align-items:center;margin:11px 0 12px;padding:7px 12px;border-radius:8px;border-left:4px solid}
  .bct-bet.bct-over{background:color-mix(in oklch,var(--over) 12%,transparent);border-color:var(--over)}
  .bct-bet.bct-under{background:color-mix(in oklch,var(--under) 12%,transparent);border-color:var(--under)}
  .bct-bet .bct-side{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.03em}
  .bct-over .bct-side{color:var(--over)}.bct-under .bct-side{color:var(--under)}
  .bct-bet .bct-ln{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:19px;margin-left:11px}
  .bct-bet .bct-proj{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
  .bct-bet .bct-proj b{color:var(--ink);font-weight:600}
  .bct-tiles{display:flex;gap:9px}
  .bct-tile{flex:1;background:var(--tile);border:1px solid var(--line);border-radius:10px;padding:9px 11px 10px;position:relative;overflow:hidden}
  .bct-tile.bct-best{border-color:var(--acc-d)}.bct-tile.bct-off{opacity:.45}
  .bct-tbk{display:flex;align-items:center;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;color:var(--mute);text-transform:uppercase}
  .bct-tdot{width:6px;height:6px;border-radius:50%;flex:0 0 auto;margin-right:6px}
  .bct-tdot.bct-dk{background:oklch(0.74 0.16 150)}.bct-tdot.bct-fd{background:oklch(0.66 0.16 250)}
  .bct-tdot.bct-pp{background:var(--acc)}
  .bct-trow{display:flex;align-items:baseline;margin-top:5px}
  .bct-tln{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:24px;line-height:.9;font-variant-numeric:tabular-nums}
  .bct-tpx{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:var(--acc);font-variant-numeric:tabular-nums;margin-left:9px}
  .bct-tpx.bct-na{color:var(--faint)}
  .bct-ribbon{position:absolute;top:0;right:0;font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--bg);background:var(--acc);padding:2px 8px;border-bottom-left-radius:8px}
  .bct-foot{display:flex;align-items:center;justify-content:space-between;margin-top:18px;padding-top:13px;border-top:2px solid var(--line);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
  .bct-foot b{color:var(--acc-d);font-weight:600}
  .bct-foot a{color:var(--faint);text-decoration:none;cursor:pointer}
  .bct-empty{color:var(--mute);text-align:center;padding:40px 20px;font-family:'Saira Condensed',sans-serif;text-transform:uppercase;letter-spacing:.08em}
  .wc-note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:11px;
    font-family:'JetBrains Mono',monospace;font-size:10.5px;line-height:1.65;color:var(--mute);letter-spacing:.01em}
  .loading{text-align:center;padding:60px 20px;color:var(--mute);font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Loading…</div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL  = 'https://zuijmbyrwzixnhcaqgpl.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_64yRp9qL6lES2TGOItXeEg_UFtWQfJ2';

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById('app');

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtLine = x => (x == null ? '' : (+x).toString());
const fmtOdds = x => (x == null ? '' : (x > 0 ? '+' + x : '' + x));

let view = 'k';        // 'k' | 'tennis' | 'epl' | 'wc'
let tstat = 'ace';     // 'ace' | 'df'
let wstat = 'Shots';   // 'Shots' | 'Shots On Target'

// Friends sign in with a simple username + password. Supabase is email-based,
// so the username is mapped to <username>@raya-hq.com under the hood — no real
// email is needed or sent (requires "Confirm email" OFF in Supabase Auth).
const USER_DOMAIN = '@raya-hq.com';
function authScreen(msg, cls) {
  app.innerHTML = `
    <div class="auth">
      <div class="mark">Raya</div>
      <div class="tag">Daily Brief</div>
      <p id="sub">Sign in with your username and password.</p>
      <input id="user" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="username" />
      <input id="pass" type="password" autocomplete="current-password" placeholder="password" />
      <button id="go">Sign in</button>
      <div class="switch">New here? <a id="toggle">Create an account</a></div>
      <div class="msg ${cls||''}" id="msg">${msg||''}</div>
    </div>`;
  const U = document.getElementById('user');
  const P = document.getElementById('pass');
  const btn = document.getElementById('go');
  const out = document.getElementById('msg');
  const tog = document.getElementById('toggle');
  const sub = document.getElementById('sub');
  let mode = 'signin';
  tog.onclick = () => {
    mode = mode === 'signin' ? 'signup' : 'signin';
    btn.textContent = mode === 'signin' ? 'Sign in' : 'Create account';
    tog.textContent = mode === 'signin' ? 'Create an account' : 'Have an account? Sign in';
    sub.textContent = mode === 'signin'
      ? 'Sign in with your username and password.'
      : 'Pick a username and password to create your account.';
    out.textContent = ''; out.className = 'msg';
  };
  btn.onclick = async () => {
    const u = U.value.trim().toLowerCase().replace(/[^a-z0-9_.-]/g, '');
    const p = P.value;
    if (!u || !p) { out.className='msg err'; out.textContent='Enter a username and password.'; return; }
    if (p.length < 6) { out.className='msg err'; out.textContent='Password must be at least 6 characters.'; return; }
    btn.disabled = true; out.className='msg'; out.textContent = mode === 'signup' ? 'Creating…' : 'Signing in…';
    const creds = { email: u + USER_DOMAIN, password: p };
    const { error } = mode === 'signup'
      ? await sb.auth.signUp(creds)
      : await sb.auth.signInWithPassword(creds);
    if (error) {
      out.className = 'msg err';
      out.textContent = /invalid login/i.test(error.message) ? 'Wrong username or password.' : error.message;
      btn.disabled = false;
    }
    // success -> onAuthStateChange fires -> render()
  };
  P.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });
}

/* ── strikeout card (unchanged) ── */
function kCard(p, i) {
  const differ = p.dk_line != null && p.fd_line != null && (+p.dk_line) !== (+p.fd_line);
  const sideOver = (p.bet_side || '').toLowerCase() === 'over';
  const tile = (bk, label, dot, ln, px) => {
    if (ln == null) return '';
    const best = p.best_book === bk;
    const off  = differ && !best;
    const cls  = 'bct-tile' + (best ? ' bct-best' : '') + (off ? ' bct-off' : '');
    const ribbon = best ? '<span class="bct-ribbon">Raya Bet</span>' : '';
    const price = off ? '<span class="bct-tpx bct-na">off line</span>'
                      : `<span class="bct-tpx">${fmtOdds(px)}</span>`;
    return `<div class="${cls}">${ribbon}
      <div class="bct-tbk"><span class="bct-tdot ${dot}"></span>${label}</div>
      <div class="bct-trow"><span class="bct-tln">${fmtLine(ln)}</span>${price}</div></div>`;
  };
  return `<div class="bct-card">
    <div class="bct-rail"><div class="bct-rank"><b>NO</b>${String(i).padStart(2,'0')}</div></div>
    <div class="bct-main">
      <div class="bct-name">${esc(p.pitcher_name)}</div>
      <div class="bct-match">${esc(p.event_name)}</div>
      <div class="bct-bet ${sideOver?'bct-over':'bct-under'}">
        <span class="bct-side">${esc((p.bet_side||'').toUpperCase())}</span>
        <span class="bct-ln">${fmtLine(p.book_line)}</span>
        <span class="bct-proj">PROJ <b>${p.raya_projected_k!=null?(+p.raya_projected_k).toFixed(2):'--'} K</b></span>
      </div>
      <div class="bct-tiles">
        ${tile('draftkings','DraftKings','bct-dk',p.dk_line,p.dk_price)}
        ${tile('fanduel','FanDuel','bct-fd',p.fd_line,p.fd_price)}
      </div>
    </div></div>`;
}

/* ── tennis card (new, same visual language) ── */
function tennisCard(p, i) {
  const sideOver = (p.bet_side || '').toLowerCase() === 'over';
  const unit = p.stat === 'df' ? 'DF' : 'ACES';
  const sideProb = p.p_over == null ? null : (sideOver ? +p.p_over : 1 - +p.p_over);
  const ppTile = `<div class="bct-tile bct-best"><span class="bct-ribbon">PrizePicks</span>
    <div class="bct-tbk"><span class="bct-tdot bct-pp"></span>${esc((p.odds_type||'std').toUpperCase())}</div>
    <div class="bct-trow"><span class="bct-tln">${fmtLine(p.pp_line)}</span></div></div>`;
  const modelTile = `<div class="bct-tile">
    <div class="bct-tbk"><span class="bct-tdot bct-dk"></span>Model${p.confidence?' · '+esc(p.confidence):''}</div>
    <div class="bct-trow"><span class="bct-tln">${sideProb!=null?Math.round(sideProb*100)+'%':'--'}</span>
      <span class="bct-tpx">${esc((p.bet_side||'').toUpperCase())}</span></div></div>`;
  return `<div class="bct-card">
    <div class="bct-rail"><div class="bct-rank"><b>NO</b>${String(i).padStart(2,'0')}</div></div>
    <div class="bct-main">
      <div class="bct-name">${esc(p.player_name)}</div>
      <div class="bct-match">${esc(p.event_name)} &middot; ${esc((p.surface||'').toUpperCase())}</div>
      <div class="bct-bet ${sideOver?'bct-over':'bct-under'}">
        <span class="bct-side">${esc((p.bet_side||'').toUpperCase())}</span>
        <span class="bct-ln">${fmtLine(p.pp_line)}</span>
        <span class="bct-proj">PROJ <b>${p.raya_proj!=null?(+p.raya_proj).toFixed(2):'--'} ${unit}</b></span>
      </div>
      <div class="bct-tiles">${ppTile}${modelTile}</div>
    </div></div>`;
}

/* ── EPL shots card (PrizePicks-shaped, mirrors tennis) ── */
function soccerCard(p, i) {
  const sideOver = (p.bet_side || '').toLowerCase() === 'over';
  const unit = ({shots:'SH','shots on target':'SOT',sot:'SOT',key_passes:'KP',kp:'KP'})[(p.stat||'').toLowerCase()] || (p.stat ? p.stat.toUpperCase() : 'SH');
  const sideProb = p.p_over == null ? null : (sideOver ? +p.p_over : 1 - +p.p_over);
  const ha = (p.home_away||'').toUpperCase();
  const ppTile = `<div class="bct-tile bct-best"><span class="bct-ribbon">PrizePicks</span>
    <div class="bct-tbk"><span class="bct-tdot bct-pp"></span>${esc((p.odds_type||'std').toUpperCase())}</div>
    <div class="bct-trow"><span class="bct-tln">${fmtLine(p.line)}</span></div></div>`;
  const modelTile = `<div class="bct-tile">
    <div class="bct-tbk"><span class="bct-tdot bct-dk"></span>Model${p.confidence?' &middot; '+esc(p.confidence):''}</div>
    <div class="bct-trow"><span class="bct-tln">${sideProb!=null?Math.round(sideProb*100)+'%':'--'}</span>
      <span class="bct-tpx">${esc((p.bet_side||'').toUpperCase())}</span></div></div>`;
  return `<div class="bct-card">
    <div class="bct-rail"><div class="bct-rank"><b>NO</b>${String(i).padStart(2,'0')}</div></div>
    <div class="bct-main">
      <div class="bct-name">${esc(p.player_name)}</div>
      <div class="bct-match">${esc(p.team||'')} vs ${esc(p.opponent||'')}${ha?' &middot; '+ha:''}</div>
      <div class="bct-bet ${sideOver?'bct-over':'bct-under'}">
        <span class="bct-side">${esc((p.bet_side||'').toUpperCase())}</span>
        <span class="bct-ln">${fmtLine(p.line)}</span>
        <span class="bct-proj">PROJ <b>${p.raya_proj!=null?(+p.raya_proj).toFixed(2):'--'} ${unit}</b></span>
      </div>
      <div class="bct-tiles">${ppTile}${modelTile}</div>
    </div></div>`;
}

/* ── World Cup watch card (tracked line, NOT a call) ── */
function wcCard(r, i) {
  const tag = wstat === 'Shots' ? 'SH' : 'SOT';
  return `<div class="bct-card">
    <div class="bct-rail"><div class="bct-rank" style="font-size:20px"><b>WC</b>${String(i).padStart(2,'0')}</div></div>
    <div class="bct-main">
      <div class="bct-name">${esc(r.player)}</div>
      <div class="bct-match">${esc(r.team||'')} vs ${esc(r.opponent||'')}</div>
      <div class="bct-bet" style="border-color:var(--acc-d);background:color-mix(in oklch,var(--acc) 9%,transparent)">
        <span class="bct-side" style="color:var(--acc)">Watch</span>
        <span class="bct-ln">${fmtLine(r.line)}</span>
        <span class="bct-proj">${tag} &middot; <b>CLV-tracked</b></span>
      </div>
    </div></div>`;
}

function shell(metaTitle, metaSub, body, footL, footR) {
  const subtabs = view === 'tennis' ? `
    <div class="subtabs">
      <div class="subtab ${tstat==='ace'?'on':''}" data-stat="ace">Aces</div>
      <div class="subtab ${tstat==='df'?'on':''}" data-stat="df">Double Faults</div>
    </div>` : view === 'wc' ? `
    <div class="subtabs">
      <div class="subtab ${wstat==='Shots'?'on':''}" data-stat="Shots">Shots</div>
      <div class="subtab ${wstat==='Shots On Target'?'on':''}" data-stat="Shots On Target">On Target</div>
    </div>` : '';
  app.innerHTML = `<div class="bct">
    <div class="bct-hdr">
      <div class="bct-bars"><i></i><i></i><i></i></div>
      <div class="bct-logo">Raya</div>
      <div class="bct-meta"><b>${metaTitle}</b><span>${metaSub}</span></div>
    </div>
    <div class="tabs">
      <div class="tab ${view==='k'?'on':''}" data-view="k">Strikeout</div>
      <div class="tab ${view==='tennis'?'on':''}" data-view="tennis">Tennis</div>
      <div class="tab ${view==='epl'?'on':''}" data-view="epl">EPL Shots</div>
      <div class="tab ${view==='wc'?'on':''}" data-view="wc">World Cup</div>
    </div>
    ${subtabs}
    <div class="bct-list" id="list">${body}</div>
    <div class="bct-foot"><span>${footL}</span>
      <span>${footR} &middot; <a id="signout">Sign out</a></span></div>
  </div>`;
  app.querySelectorAll('.tab').forEach(t => t.onclick = () => { view = t.dataset.view; render(); });
  app.querySelectorAll('.subtab').forEach(t => t.onclick = () => { if (view === 'wc') { wstat = t.dataset.stat; } else { tstat = t.dataset.stat; } render(); });
  const so = document.getElementById('signout');
  if (so) so.onclick = async () => { await sb.auth.signOut(); route(); };
}

async function render() {
  app.innerHTML = `<div class="loading">Loading…</div>`;
  if (view === 'k') {
    const { data, error } = await sb.from('mlb_k_brief').select('*').order('rank', { ascending: true });
    if (error) return shell('Strikeout Brief','', `<div class="bct-empty">Couldn't load.<br>${esc(error.message)}</div>`, '', '');
    const picks = data || [];
    const dateLbl = picks[0]?.run_at ? new Date(picks[0].run_at).toLocaleDateString('en-US',
      { weekday:'short', month:'short', day:'numeric', year:'numeric' }).toUpperCase() : '';
    const body = picks.length ? picks.map((p,idx)=>kCard(p,idx+1)).join('')
                              : '<div class="bct-empty">No picks posted yet today.</div>';
    shell('Strikeout Brief', `${dateLbl} &middot; Opening Lines`, body,
          `${picks.length} Strikeout Calls`, 'Model <b>linreg_k_v1</b>');
  } else if (view === 'tennis') {
    const { data, error } = await sb.from('tennis_serve_brief').select('*')
      .eq('stat', tstat).order('rank', { ascending: true });
    if (error) return shell('Tennis Serve Brief','', `<div class="bct-empty">Couldn't load.<br>${esc(error.message)}</div>`, '', '');
    const picks = data || [];
    const dateLbl = picks[0]?.run_at ? new Date(picks[0].run_at).toLocaleDateString('en-US',
      { weekday:'short', month:'short', day:'numeric', year:'numeric' }).toUpperCase() : '';
    const body = picks.length ? picks.map((p,idx)=>tennisCard(p,idx+1)).join('')
                              : '<div class="bct-empty">No tennis picks posted yet.</div>';
    const label = tstat === 'df' ? 'Double-Fault Calls' : 'Ace Calls';
    shell('Tennis Serve Brief', `${dateLbl} &middot; PrizePicks Lines`, body,
          `${picks.length} ${label}`, 'Model <b>wta_serve_v1</b>');
  } else if (view === 'epl') {
    const { data, error } = await sb.from('soccer_shots_brief').select('*').order('rank', { ascending: true });
    if (error) return shell('EPL Shots Brief','', `<div class="bct-empty">Couldn't load.<br>${esc(error.message)}</div>`, '', '');
    const picks = data || [];
    const dateLbl = picks[0]?.run_at ? new Date(picks[0].run_at).toLocaleDateString('en-US',
      { weekday:'short', month:'short', day:'numeric', year:'numeric' }).toUpperCase() : '';
    const body = picks.length ? picks.map((p,idx)=>soccerCard(p,idx+1)).join('')
                              : '<div class="bct-empty">No EPL picks posted &mdash; the shots brief resumes when the season returns.</div>';
    shell('EPL Shots Brief', `${dateLbl} &middot; PrizePicks Lines`, body,
          `${picks.length} Shot Calls`, 'Model <b>understat shots</b>');
  } else {
    // World Cup — watch list of tracked lines (no calls; CLV-tracked on HQ)
    const { data, error } = await sb.from('intl_shots_line_snapshots').select('*')
      .eq('odds_type', 'standard').order('captured_at', { ascending: false }).limit(400);
    const rows = error ? [] : (data || []);
    const latestTs = rows.length ? rows[0].captured_at : null;
    const board = rows.filter(r => r.captured_at === latestTs && r.stat_type === wstat)
                      .sort((a,b) => (+b.line) - (+a.line));
    const note = `<div class="wc-note">World Cup isn't a call board &mdash; the shots model doesn't beat the market, so there are no picks here. These are the standard lines Raya is tracking into the openers; closing-line value is graded on the HQ scoreboard.</div>`;
    const body = board.length
      ? note + board.map((r,idx)=>wcCard(r,idx+1)).join('')
      : `${note}<div class="bct-empty">No standard ${wstat==='Shots'?'shot':'SOT'} lines posted yet.</div>`;
    const dateLbl = latestTs ? new Date(latestTs).toLocaleDateString('en-US',
      { weekday:'short', month:'short', day:'numeric' }).toUpperCase() : '';
    shell('World Cup Watch', `${dateLbl} &middot; Lines Tracked`, body,
          `${board.length} ${wstat==='Shots'?'Shot':'SOT'} Lines`, 'CLV &middot; <b>grades after Jun 11</b>');
  }
}

async function route() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) render(); else authScreen();
}

sb.auth.onAuthStateChange((_e, session) => { if (session) render(); });
route();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
