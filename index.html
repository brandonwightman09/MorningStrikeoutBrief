<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16140f">
<title>Raya — Brief</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Raya Brief">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Saira+Condensed:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:oklch(0.165 0.012 72);--card:oklch(0.205 0.013 74);--tile:oklch(0.150 0.011 72);
    --ink:oklch(0.95 0.012 88);--mute:oklch(0.66 0.012 82);--faint:oklch(0.52 0.010 80);
    --line:oklch(0.30 0.009 76);--acc:oklch(0.80 0.105 86);--acc-d:oklch(0.62 0.085 82);
    --over:oklch(0.76 0.10 152);--under:oklch(0.72 0.13 34);
  }
  html,body{background:oklch(0.125 0.010 72);min-height:100%;-webkit-font-smoothing:antialiased}
  body{display:flex;justify-content:center;padding:max(18px,env(safe-area-inset-top)) 14px 26px;
    font-family:'Hanken Grotesk',system-ui,sans-serif;color:var(--ink)}
  .wrap{width:446px;max-width:100%}

  .auth{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:40px 28px;text-align:center;margin-top:8vh}
  .auth .mark{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:52px;letter-spacing:.05em;color:var(--acc);line-height:.9;text-transform:uppercase}
  .auth .tag{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-top:8px}
  .auth p{color:var(--mute);font-size:14px;margin:22px 0 18px;line-height:1.5}
  .auth input{width:100%;background:var(--tile);border:1px solid var(--line);border-radius:10px;
    padding:13px 14px;color:var(--ink);font-size:15px;font-family:inherit;outline:none}
  .auth input:focus{border-color:var(--acc-d)}
  .auth button{width:100%;margin-top:11px;background:var(--acc);color:oklch(0.165 0.012 72);border:none;
    border-radius:10px;padding:13px;font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:16px;
    letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .auth button:disabled{opacity:.5;cursor:default}
  .auth input+input{margin-top:9px}
  .auth .switch{margin-top:15px;font-size:13px;color:var(--mute)}
  .auth .switch a{color:var(--acc-d);cursor:pointer;text-decoration:none;font-weight:600}
  .auth .msg{margin-top:16px;font-size:13px;min-height:18px;line-height:1.45}
  .auth .msg.ok{color:var(--over)}.auth .msg.err{color:var(--under)}

  .bct{background:var(--bg);border-radius:16px;padding:26px 26px 22px;display:flex;flex-direction:column}
  .bct-hdr{display:flex;align-items:center;gap:13px;padding-bottom:16px;margin-bottom:18px;border-bottom:2px solid var(--line);position:relative}
  .bct-hdr::after{content:'';position:absolute;left:0;bottom:-2px;width:84px;height:2px;background:var(--acc)}
  .bct-bars{display:flex;gap:3px;align-items:center}
  .bct-bars i{width:5px;height:26px;background:var(--acc);border-radius:1px;transform:skewX(-12deg)}
  .bct-bars i:nth-child(2){height:20px;opacity:.6}.bct-bars i:nth-child(3){height:14px;opacity:.35}
  .bct-logo{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:38px;letter-spacing:.04em;line-height:.9;text-transform:uppercase}
  .bct-meta{margin-left:auto;text-align:right;line-height:1.35}
  .bct-meta b{display:block;font-family:'Saira Condensed',sans-serif;font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase}
  .bct-meta span{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}

  /* ── tabs (added) ─────────────────────────── */
  .tabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
  .tab{flex:1 1 calc(33.333% - 5px);text-align:center;background:var(--tile);border:1px solid var(--line);border-radius:11px;padding:10px;
    font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--mute);cursor:pointer}
  .tab.on{background:var(--acc);color:oklch(0.165 0.012 72);border-color:var(--acc)}
  .subtabs{display:flex;gap:7px;margin-bottom:13px}
  .subtab{flex:1;text-align:center;background:transparent;border:1px solid var(--line);border-radius:9px;padding:7px;
    font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);cursor:pointer}
  .subtab.on{border-color:var(--acc-d);color:var(--acc)}

  .bct-list{display:flex;flex-direction:column;gap:11px}
  .bct-card{display:grid;grid-template-columns:58px 1fr;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
  .bct-rail{background:linear-gradient(160deg,var(--card),var(--tile));position:relative;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line)}
  .bct-rail::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc)}
  .bct-rank{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:38px;line-height:.85;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .bct-rank b{display:block;font-size:8px;font-weight:700;letter-spacing:.18em;color:var(--faint);text-align:center;margin-bottom:3px}
  .bct-main{padding:13px 15px 14px;min-width:0}
  .bct-name{font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:25px;line-height:.98;text-transform:uppercase;letter-spacing:.01em}
  .bct-match{font-family:'Saira Condensed',sans-serif;font-weight:500;font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;margin-top:1px}
  .bct-bet{display:flex;align-items:center;margin:11px 0 12px;padding:7px 12px;border-radius:8px;border-left:4px solid}
  .bct-bet.bct-over{background:color-mix(in oklch,var(--over) 12%,transparent);border-color:var(--over)}
  .bct-bet.bct-under{background:color-mix(in oklch,var(--under) 12%,transparent);border-color:var(--under)}
  .bct-bet .bct-side{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.03em}
  .bct-over .bct-side{color:var(--over)}.bct-under .bct-side{color:var(--under)}
  .bct-bet .bct-ln{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:19px;margin-left:11px}
  .bct-bet .bct-proj{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
  .bct-bet .bct-proj b{color:var(--ink);font-weight:600}
  .bct-tiles{display:flex;gap:9px}
  .bct-tile{flex:1;background:var(--tile);border:1px solid var(--line);border-radius:10px;padding:9px 11px 10px;position:relative;overflow:hidden}
  .bct-tile.bct-best{border-color:var(--acc-d)}.bct-tile.bct-off{opacity:.45}
  .bct-tbk{display:flex;align-items:center;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;color:var(--mute);text-transform:uppercase}
  .bct-tdot{width:6px;height:6px;border-radius:50%;flex:0 0 auto;margin-right:6px}
  .bct-tdot.bct-dk{background:oklch(0.74 0.16 150)}.bct-tdot.bct-fd{background:oklch(0.66 0.16 250)}
  .bct-tdot.bct-pp{background:var(--acc)}
  .bct-tdot.bct-mgm{background:oklch(0.80 0.15 85)}.bct-tdot.bct-hr{background:oklch(0.62 0.21 350)}
  .bct-cmeta{margin-top:11px;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .bct-cmeta b{color:var(--acc-d);font-weight:600}
  .bct-trow{display:flex;align-items:baseline;margin-top:5px}
  .bct-tln{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:24px;line-height:.9;font-variant-numeric:tabular-nums}
  .bct-tpx{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:var(--acc);font-variant-numeric:tabular-nums;margin-left:9px}
  .bct-tpx.bct-na{color:var(--faint)}
  .bct-ribbon{position:absolute;top:0;right:0;font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--bg);background:var(--acc);padding:2px 8px;border-bottom-left-radius:8px}
  .bct-placed{border-color:var(--over)}
  .bct-placechip{display:inline-flex;align-items:center;gap:4px;margin-left:8px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--over);border:1px solid var(--over);border-radius:6px;padding:1px 6px;vertical-align:middle}
  .bct-foot{display:flex;align-items:center;justify-content:space-between;margin-top:18px;padding-top:13px;border-top:2px solid var(--line);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
  .bct-foot b{color:var(--acc-d);font-weight:600}
  .bct-foot a{color:var(--faint);text-decoration:none;cursor:pointer}
  .bct-empty{color:var(--mute);text-align:center;padding:40px 20px;font-family:'Saira Condensed',sans-serif;text-transform:uppercase;letter-spacing:.08em}
  .wc-note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:11px;
    font-family:'JetBrains Mono',monospace;font-size:10.5px;line-height:1.65;color:var(--mute);letter-spacing:.01em}
  .loading{text-align:center;padding:60px 20px;color:var(--mute);font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Loading…</div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL  = 'https://zuijmbyrwzixnhcaqgpl.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_64yRp9qL6lES2TGOItXeEg_UFtWQfJ2';

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById('app');

// Open the DraftKings app at the exact game; fall back to the web event page.
window.placeDK = (web) => {
  const m = (web || '').match(/\/event\/(\d+)/);
  if (!m) { window.location.href = web; return; }   // lobby / no event id -> web
  const appUrl = `dksb://sb/event/${m[1]}`;
  let left = false;
  const onHide = () => { left = true; };
  document.addEventListener('visibilitychange', onHide, { once: true });
  setTimeout(() => {
    document.removeEventListener('visibilitychange', onHide);
    if (!left && !document.hidden) window.location.href = web;   // app didn't take over
  }, 1200);
  window.location.href = appUrl;   // try the app first
};

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtLine = x => (x == null ? '' : (+x).toString());
const fmtOdds = x => (x == null ? '' : (x > 0 ? '+' + x : '' + x));

let view = 'k';        // 'k' | 'wnba' | 'nfl' | 'parlay'
let edgeMode = 'live';  // 'live' (my books, upcoming) | 'all' (every book) | 'results'
let nflMode = 'place';  // 'place' (check picks, default) | 'all'
let wstat = 'Shots';   // 'Shots' | 'Shots On Target'
let wnbaStat = 'place';  // 'place' (top-5 with check, default) | 'all' | 'points' | 'rebounds' | 'assists' | 'threes'
let kmode = 'flat';    // 'flat' | 'kelly' — strikeout stake sizing; flat is the live default

// Strikeout staking config (edit and redeploy to change). 1 unit = $30.
// Flat stakes 1u per pick. ¼-Kelly sizes off raya_prob vs the best price,
// capped per pick and scaled so the slate total never exceeds slateCapU.
const STAKE = { bankroll: 1500, unit: 30, kellyFrac: 0.25, pickCapU: 2.0, slateCapU: 5.0 };
let _kStakes = {};     // computed each render: pitcher_name -> { stakeU, dollars, toWin }

// Visible build stamp — bump on each deploy. Lets you confirm at a glance which
// markup the Home-Screen icon is actually running. Keep the version aligned with
// the service-worker cache name in sw.js (currently 'raya-brief-v2').
const BUILD = 'v8.1 / 2026-10-03';

// Friends sign in with a simple username + password. Supabase is email-based,
// so the username is mapped to <username>@raya-hq.com under the hood — no real
// email is needed or sent (requires "Confirm email" OFF in Supabase Auth).
const USER_DOMAIN = '@raya-hq.com';
function authScreen(msg, cls) {
  app.innerHTML = `
    <div class="auth">
      <div class="mark">Raya</div>
      <div class="tag">Daily Brief</div>
      <p id="sub">Sign in with your username and password.</p>
      <input id="user" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="username" />
      <input id="pass" type="password" autocomplete="current-password" placeholder="password" />
      <button id="go">Sign in</button>
      <div class="switch">New here? <a id="toggle">Create an account</a></div>
      <div class="msg ${cls||''}" id="msg">${msg||''}</div>
    </div>`;
  const U = document.getElementById('user');
  const P = document.getElementById('pass');
  const btn = document.getElementById('go');
  const out = document.getElementById('msg');
  const tog = document.getElementById('toggle');
  const sub = document.getElementById('sub');
  let mode = 'signin';
  tog.onclick = () => {
    mode = mode === 'signin' ? 'signup' : 'signin';
    btn.textContent = mode === 'signin' ? 'Sign in' : 'Create account';
    tog.textContent = mode === 'signin' ? 'Create an account' : 'Have an account? Sign in';
    sub.textContent = mode === 'signin'
      ? 'Sign in with your username and password.'
      : 'Pick a username and password to create your account.';
    out.textContent = ''; out.className = 'msg';
  };
  btn.onclick = async () => {
    const u = U.value.trim().toLowerCase().replace(/[^a-z0-9_.-]/g, '');
    const p = P.value;
    if (!u || !p) { out.className='msg err'; out.textContent='Enter a username and password.'; return; }
    if (p.length < 6) { out.className='msg err'; out.textContent='Password must be at least 6 characters.'; return; }
    btn.disabled = true; out.className='msg'; out.textContent = mode === 'signup' ? 'Creating…' : 'Signing in…';
    const creds = { email: u + USER_DOMAIN, password: p };
    const { error } = mode === 'signup'
      ? await sb.auth.signUp(creds)
      : await sb.auth.signInWithPassword(creds);
    if (error) {
      out.className = 'msg err';
      out.textContent = /invalid login/i.test(error.message) ? 'Wrong username or password.' : error.message;
      btn.disabled = false;
    }
    // success -> onAuthStateChange fires -> render()
  };
  P.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });
}

/* ── strikeout card (unchanged) ── */
function computeKStakes(picks) {
  const dec = px => px == null ? null : (px > 0 ? 1 + px/100 : 1 + 100/Math.abs(px));
  const raw = picks.map(p => {
    const d = dec(p.best_price);
    if (d == null) return { u:0, b:null };
    const b = d - 1, prob = p.raya_prob != null ? +p.raya_prob : null;
    if (prob == null) return { u:0, b };
    const f = (prob*b - (1-prob)) / b;
    const u = Math.max(0, Math.min(STAKE.pickCapU, f*STAKE.kellyFrac*STAKE.bankroll/STAKE.unit));
    return { u, b };
  });
  const slate = raw.reduce((s,r)=>s+r.u,0);
  const scale = slate > STAKE.slateCapU ? STAKE.slateCapU/slate : 1;
  const out = {};
  picks.forEach((p,idx) => {
    const r = raw[idx];
    const stakeU = kmode === 'flat' ? 1.0 : +(r.u*scale).toFixed(2);
    const dollars = Math.round(stakeU * STAKE.unit);
    const toWin = (r.b != null && dollars > 0) ? Math.round(dollars * r.b) : null;
    out[p.pitcher_name] = { stakeU, dollars, toWin };
  });
  return out;
}

function kCard(p, i) {
  const differ = p.dk_line != null && p.fd_line != null && (+p.dk_line) !== (+p.fd_line);
  const sideOver = (p.bet_side || '').toLowerCase() === 'over';
  const tile = (bk, label, dot, ln, px) => {
    if (ln == null) return '';
    const best = p.best_book === bk;
    const off  = differ && !best;
    const cls  = 'bct-tile' + (best ? ' bct-best' : '') + (off ? ' bct-off' : '');
    const ribbon = best ? '<span class="bct-ribbon">Raya Bet</span>' : '';
    const price = off ? '<span class="bct-tpx bct-na">off line</span>'
                      : `<span class="bct-tpx">${fmtOdds(px)}</span>`;
    return `<div class="${cls}">${ribbon}
      <div class="bct-tbk"><span class="bct-tdot ${dot}"></span>${label}</div>
      <div class="bct-trow"><span class="bct-tln">${fmtLine(ln)}</span>${price}</div></div>`;
  };
  return `<div class="bct-card">
    <div class="bct-rail"><div class="bct-rank"><b>NO</b>${String(i).padStart(2,'0')}</div></div>
    <div class="bct-main">
      <div class="bct-name">${esc(p.pitcher_name)}</div>
      <div class="bct-match">${esc(p.event_name)}</div>
      <div class="bct-bet ${sideOver?'bct-over':'bct-under'}">
        <span class="bct-side">${esc((p.bet_side||'').toUpperCase())}</span>
        <span class="bct-ln">${fmtLine(p.book_line)}</span>
        <span class="bct-proj">PROJ <b>${p.raya_projected_k!=null?(+p.raya_projected_k).toFixed(2):'--'} K</b></span>
      </div>
      <div class="bct-tiles">
        ${tile('draftkings','DraftKings','bct-dk',p.dk_line,p.dk_price)}
        ${tile('fanduel','FanDuel','bct-fd',p.fd_line,p.fd_price)}
      </div>
      ${(() => {
        const st = _kStakes[p.pitcher_name] || { stakeU:1, dollars:STAKE.unit, toWin:null };
        if (!(st.dollars > 0)) return '';
        const isFD = p.best_book === 'fanduel';
        const label = isFD ? 'FanDuel' : 'DraftKings';
        const bg = isFD ? 'oklch(0.66 0.16 250)' : 'oklch(0.74 0.16 150)';
        const fg = isFD ? 'oklch(0.97 0.02 250)' : 'oklch(0.16 0.02 150)';
        const q = encodeURIComponent(p.pitcher_name);
        const url = isFD ? `https://sportsbook.fanduel.com/search?q=${q}`
                         : (p.dk_link || `https://sportsbook.draftkings.com/leagues/baseball/mlb`);
        const clickAttr = isFD ? 'target="_blank" rel="noopener"' : `onclick="placeDK('${url}');return false;"`;
        const win = st.toWin != null ? `<div style="display:flex;flex-direction:column;line-height:1.1">
            <span style="font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase">To win</span>
            <span style="font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:18px;color:var(--over)">$${st.toWin}</span></div>` : '';
        return `<div style="display:flex;align-items:center;gap:14px;margin-top:12px;padding:9px 11px;background:var(--tile);border:1px dashed var(--line);border-radius:9px">
          <div style="display:flex;flex-direction:column;line-height:1.1">
            <span style="font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase">Stake</span>
            <span style="font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:18px">$${st.dollars}<small style="font-size:11px;color:var(--mute);font-weight:600;margin-left:3px">${st.stakeU.toFixed(1)}u</small></span></div>
          ${win}
          <span style="margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.08em;color:var(--acc);text-transform:uppercase">${kmode==='kelly'?'¼-Kelly':'Flat 1u'}</span>
        </div>
        <a href="${url}" ${clickAttr} style="display:flex;align-items:center;justify-content:center;gap:7px;margin-top:9px;padding:11px;border-radius:9px;text-decoration:none;font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase;background:${bg};color:${fg}">Place on ${label} &#8599;</a>`;
      })()}
    </div></div>`;
}

/* ── pitcher-outs card (forward-test): mirrors kCard, reads raya_projected_outs,
   no Kelly/deep-link block (paper only, mlb_outs_brief has no dk_link/stakes) ── */
function wnbaCard(p, i) {
  const lns = [p.dk_line, p.fd_line, p.pin_line].filter(x => x != null);
  const differ = lns.length > 1 && Math.max(...lns) !== Math.min(...lns);
  const sideOver = (p.bet_side || '').toLowerCase() === 'over';
  const unit = ({points:'PTS',rebounds:'REB',assists:'AST',threes:'3PM'})[p.stat] || '';
  const tile = (bk, label, dot, ln, px) => {
    if (ln == null) return '';
    const best = p.best_book === bk;
    const off  = differ && !best;
    const cls  = 'bct-tile' + (best ? ' bct-best' : '') + (off ? ' bct-off' : '');
    const ribbon = best ? '<span class="bct-ribbon">Raya Bet</span>' : '';
    const price = off ? '<span class="bct-tpx bct-na">off line</span>'
                      : `<span class="bct-tpx">${fmtOdds(px)}</span>`;

                   totals:'TOTAL', total:'TOTAL', moneyline:'ML' };
const EDGE_BOOK = { draftkings:['DraftKings','bct-dk'], fanduel:['FanDuel','bct-fd'], betmgm:['BetMGM','bct-mgm'], hardrock:['Hard Rock','bct-hr'],
                    caesars:['Caesars','bct-pp'], thescore:['theScore','bct-pp'] };

function edgeWhen(iso) {
  const d = new Date(iso); if (isNaN(d)) return '';
  const mins = Math.round((d - Date.now()) / 60000);
  const t = d.toLocaleString('en-US', { weekday:'short', hour:'numeric', minute:'2-digit', timeZone:'America/New_York' }).toUpperCase();
  return mins > 0 && mins < 180 ? `${t} &middot; ${mins}M` : t;

    <div class="subtabs" style="justify-content:flex-end">
      <div class="subtab ${kmode==='flat'?'on':''}" data-kmode="flat" style="flex:0 0 auto;padding:7px 16px">Flat 1u</div>
      <div class="subtab ${kmode==='kelly'?'on':''}" data-kmode="kelly" style="flex:0 0 auto;padding:7px 16px">&frac14;-Kelly</div>
    </div>` : view === 'wnba' ? `
    <div class="subtabs">
      <div class="subtab ${wnbaStat==='place'?'on':''}" data-wstat="place">&#10003;</div>
      <div class="subtab ${wnbaStat==='all'?'on':''}" data-wstat="all">All</div>
      <div class="subtab ${wnbaStat==='points'?'on':''}" data-wstat="points">Pts</div>
      <div class="subtab ${wnbaStat==='rebounds'?'on':''}" data-wstat="rebounds">Reb</div>
      <div class="subtab ${wnbaStat==='assists'?'on':''}" data-wstat="assists">Ast</div>
      <div class="subtab ${wnbaStat==='threes'?'on':''}" data-wstat="threes">3PM</div>
    </div>` : view === 'nfl' ? `
    <div class="subtabs">
      <div class="subtab ${nflMode==='place'?'on':''}" data-nfl="place">&#10003; Place</div>
      <div class="subtab ${nflMode==='all'?'on':''}" data-nfl="all">All</div>
    </div>` : view === 'edge' ? `
    <div class="subtabs">
      <div class="subtab ${edgeMode==='live'?'on':''}" data-edge="live">My Books</div>
      <div class="subtab ${edgeMode==='all'?'on':''}" data-edge="all">All Books</div>
      <div class="subtab ${edgeMode==='results'?'on':''}" data-edge="results">Results</div>
    </div>` : '';
  app.innerHTML = `<div class="bct">
    <div class="bct-hdr">
      <div class="bct-bars"><i></i><i></i><i></i></div>
      <div class="bct-logo">Raya</div>
      <div class="bct-meta"><b>${metaTitle}</b><span>${metaSub}</span></div>
    </div>
    <div class="tabs">
      <div class="tab ${view==='k'?'on':''}" data-view="k">Strikeout</div>
      <div class="tab ${view==='wnba'?'on':''}" data-view="wnba">WNBA</div>
      <div class="tab ${view==='nfl'?'on':''}" data-view="nfl">NFL</div>
      <div class="tab ${view==='parlay'?'on':''}" data-view="parlay">Parlays</div>
      <div class="tab ${view==='edge'?'on':''}" data-view="edge">Edge</div>
    </div>
    ${subtabs}
    <div class="bct-list" id="list">${body}</div>
    <div class="bct-foot"><span>${footL}${footL?' &middot; ':''}<b>${BUILD}</b></span>
      <span>${footR} &middot; <a id="signout">Sign out</a></span></div>
  </div>`;
  app.querySelectorAll('.tab').forEach(t => t.onclick = () => { view = t.dataset.view; render(); });
  app.querySelectorAll('.subtab').forEach(t => t.onclick = () => { if (t.dataset.kmode) { kmode = t.dataset.kmode; } else if (t.dataset.wstat) { wnbaStat = t.dataset.wstat; } else if (t.dataset.nfl) { nflMode = t.dataset.nfl; } else if (t.dataset.edge) { edgeMode = t.dataset.edge; } render(); });
  const so = document.getElementById('signout');
  if (so) so.onclick = async () => { await sb.auth.signOut(); route(); };
}

async function render() {
  app.innerHTML = `<div class="loading">Loading…</div>`;
  if (view === 'k') {
    const { data, error } = await sb.from('mlb_k_brief').select('*').order('rank', { ascending: true });
    if (error) return shell('Strikeout Brief','', `<div class="bct-empty">Couldn't load.<br>${esc(error.message)}</div>`, '', '');
    const picks = data || [];
    _kStakes = computeKStakes(picks);
    const dateLbl = picks[0]?.run_at ? new Date(picks[0].run_at).toLocaleDateString('en-US',
      { weekday:'short', month:'short', day:'numeric', year:'numeric' }).toUpperCase() : '';
    const body = picks.length ? picks.map((p,idx)=>kCard(p,idx+1)).join('')
                              : '<div class="bct-empty">No picks posted yet today.</div>';
    shell('Strikeout Brief', `${dateLbl} &middot; Opening Lines`, body,
          `${picks.length} Strikeout Calls`, 'Model <b>linreg_k_v1</b>');
  } else if (view === 'parlay') {
    const { data, error } = await sb.from('raya_parlay_log').select('*').order('slate_date', { ascending: false }).order('built_at', { ascending: false }).limit(60);
    if (error) return shell('Parlay Brief','', `<div class="bct-empty">Couldn't load.<br>${esc(error.message)}</div>`, '', '');
    const rows = data || [];
    const latest = rows[0]?.slate_date;
    const today = rows.filter(r => r.slate_date === latest);
    const dateLbl = latest ? new Date(latest + 'T12:00:00').toLocaleDateString('en-US',
      { weekday:'short', month:'short', day:'numeric', year:'numeric' }).toUpperCase() : '';
    const rec = parlayRecord(rows);
    const body = today.length ? today.map((p,idx)=>parlayCard(p,idx+1)).join('') + rec
                              : '<div class="bct-empty">No parlays built yet today.</div>' + rec;
    shell('Parlay Brief', `${dateLbl} &middot; One Book &middot; Different Games`, body,
          `${today.length} Parlays`, 'Size <b>&frac14;&ndash;&frac12;u</b>');
  } else if (view === 'nfl') {
    // NFL props brief — latest week only (display table can carry stale weeks), slate_date joined from the log
    const [{ data, error }, { data: lg }] = await Promise.all([
      sb.from('nfl_props_brief').select('*').order('week', { ascending: false }).order('rank', { ascending: true }).limit(200),
      sb.from('nfl_props_brief_log').select('week,slate_date,player,stat,bet_side,line').order('week', { ascending: false }).limit(400)
    ]);
    if (error) return shell('NFL Props Brief','', `<div class="bct-empty">Couldn't load.<br>${esc(error.message)}</div>`, '', '');
    let picks = data || [];
    const week = picks.length ? picks[0].week : null;
    picks = picks.filter(p => p.week === week);
    const slateOf = {};
    (lg || []).filter(r => r.week === week).forEach(r => { slateOf[r.player + '|' + r.stat + '|' + r.bet_side] = r.slate_date; });
    picks.forEach(p => { p._slate = slateOf[p.player_name + '|' + p.stat + '|' + p.bet_side] || null; });
    // played games sink to the bottom, otherwise brief rank
    picks.sort((a, b) => ((a._slate && a._slate < _todayET()) - (b._slate && b._slate < _todayET())) || (a.rank - b.rank));
    if (nflMode === 'place') picks = picks.filter(p => p.place_flag === 1);
    const dateLbl = picks[0]?.run_at ? new Date(picks[0].run_at).toLocaleDateString('en-US',
      { weekday:'short', month:'short', day:'numeric', year:'numeric' }).toUpperCase() : '';
    const body = picks.length ? picks.map((p,idx)=>nflCard(p,idx+1,p._slate)).join('')
                              : `<div class="bct-empty">${nflMode==='place'?'No &#10003; picks this week.':'No NFL picks posted yet this week.'}</div>`;
    shell('NFL Props Brief', `${week?`WEEK ${week} &middot; `:''}${dateLbl} &middot; DK/FD Lines`, body,
          `${picks.length} NFL Calls`, 'Model <b>ewma16 &middot; Under-only &#10003;</b>');
  } else if (view === 'edge') {
    if (edgeMode === 'results') {
      const [{ data: sbd, error }, { data: rec }] = await Promise.all([
        sb.from('edge_scoreboard').select('*'),
        sb.from('edge_picks').select('*').eq('bettable', true).not('result', 'is', null).order('event_start', { ascending: false }).limit(40)
      ]);
      if (error) return shell('Raya Edge','', `<div class="bct-empty">Couldn't load.<br>${esc(error.message)}</div>`, '', '');
      const body = edgeBoard(sbd || []) + ((rec || []).length ? (rec || []).map(edgeResultRow).join('') : '<div class="bct-empty" style="padding:18px">No graded flags yet.</div>');
      return shell('Raya Edge', 'Paper Scoreboard &middot; My Books', body, `${(rec || []).length} Recent`, 'Ref <b>Pinnacle</b>');
    }
    const { data, error } = await sb.from('edge_picks').select('*').gt('event_start', new Date().toISOString().slice(0, 19) + 'Z').order('ev', { ascending: false }).limit(150);
    if (error) return shell('Raya Edge','', `<div class="bct-empty">Couldn't load.<br>${esc(error.message)}</div>`, '', '');
    let picks = data || [];
    if (edgeMode === 'live') picks = picks.filter(p => p.bettable);
    picks.sort((a, b) => ((a.active !== 1) - (b.active !== 1)) || (b.ev - a.ev));
    const live = picks.filter(p => p.active === 1).length;
    const body = picks.length ? picks.map((p, idx) => edgeCard(p, idx + 1)).join('')
                              : '<div class="bct-empty">No live flags right now.<br><span style="font-size:12px">Games are scanned inside 6&ndash;8 hours of start.</span></div>';
    shell('Raya Edge', `Sharp vs Soft &middot; ${edgeMode === 'live' ? 'DK / FD / MGM / Hard Rock' : 'All Books'}`, body,
          `${live} Live Flags`, 'Paper <b>gate not passed</b>');
  } else {
    // WNBA props brief — multi-book pick board (open lines), forward-test
    let q = sb.from('wnba_props_brief').select('*').order('slate_date', { ascending: false }).order('rank', { ascending: true }).limit(120);
    const { data, error } = await q;
    if (error) return shell('WNBA Props Brief','', `<div class="bct-empty">Couldn't load.<br>${esc(error.message)}</div>`, '', '');
    let picks = data || [];
    if (picks.length) { const latest = picks[0].slate_date; picks = picks.filter(p => p.slate_date === latest); }
    if (wnbaStat === 'place') picks = picks.filter(p => p.place_flag === 1 && p.rank <= 5);
    else if (wnbaStat !== 'all') picks = picks.filter(p => p.stat === wnbaStat);
    const dateLbl = picks[0]?.run_at ? new Date(picks[0].run_at).toLocaleDateString('en-US',
      { weekday:'short', month:'short', day:'numeric', year:'numeric' }).toUpperCase() : '';
    const body = picks.length ? picks.map((p,idx)=>wnbaCard(p,idx+1)).join('')
                              : '<div class="bct-empty">No WNBA picks posted yet today.</div>';
    shell('WNBA Props Brief', `${dateLbl} &middot; Opening Lines`, body,
          `${picks.length} WNBA Calls`, 'Model <b>min-anchor-v1</b>');
  }
}

async function route() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) render(); else authScreen();
}

sb.auth.onAuthStateChange((_e, session) => { if (session) render(); });
route();

/* ── keep the brief fresh on Home-Screen reopen ─────────────────────────
   iOS freezes a standalone PWA and restores it without re-fetching, so we
   re-pull the current view whenever the app returns to the foreground. ── */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

let _lastFresh = Date.now();
async function _resumeRefresh(force) {
  if (!force && document.visibilityState !== 'visible') return;
  if (!force && Date.now() - _lastFresh < 15000) return;
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;
  _lastFresh = Date.now();
  render();
}
document.addEventListener('visibilitychange', () => _resumeRefresh(false));
window.addEventListener('focus', () => _resumeRefresh(false));
window.addEventListener('pageshow', (e) => { if (e.persisted) _resumeRefresh(true); });
</script>
</body>
</html>
