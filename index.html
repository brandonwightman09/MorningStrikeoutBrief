<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16140f">
<title>Raya — Brief</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Raya Brief">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Saira+Condensed:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:oklch(0.165 0.012 72);--card:oklch(0.205 0.013 74);--tile:oklch(0.150 0.011 72);
    --ink:oklch(0.95 0.012 88);--mute:oklch(0.66 0.012 82);--faint:oklch(0.52 0.010 80);
    --line:oklch(0.30 0.009 76);--acc:oklch(0.80 0.105 86);--acc-d:oklch(0.62 0.085 82);
    --over:oklch(0.76 0.10 152);--under:oklch(0.72 0.13 34);
  }
  html,body{background:oklch(0.125 0.010 72);min-height:100%;-webkit-font-smoothing:antialiased}
  body{display:flex;justify-content:center;padding:max(18px,env(safe-area-inset-top)) 14px 26px;
    font-family:'Hanken Grotesk',system-ui,sans-serif;color:var(--ink)}
  .wrap{width:446px;max-width:100%}

  .auth{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:40px 28px;text-align:center;margin-top:8vh}
  .auth .mark{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:52px;letter-spacing:.05em;color:var(--acc);line-height:.9;text-transform:uppercase}
  .auth .tag{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-top:8px}
  .auth p{color:var(--mute);font-size:14px;margin:22px 0 18px;line-height:1.5}
  .auth input{width:100%;background:var(--tile);border:1px solid var(--line);border-radius:10px;
    padding:13px 14px;color:var(--ink);font-size:15px;font-family:inherit;outline:none}
  .auth input:focus{border-color:var(--acc-d)}
  .auth button{width:100%;margin-top:11px;background:var(--acc);color:oklch(0.165 0.012 72);border:none;
    border-radius:10px;padding:13px;font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:16px;
    letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .auth button:disabled{opacity:.5;cursor:default}
  .auth input+input{margin-top:9px}
  .auth .switch{margin-top:15px;font-size:13px;color:var(--mute)}
  .auth .switch a{color:var(--acc-d);cursor:pointer;text-decoration:none;font-weight:600}
  .auth .msg{margin-top:16px;font-size:13px;min-height:18px;line-height:1.45}
  .auth .msg.ok{color:var(--over)}.auth .msg.err{color:var(--under)}

  .bct{background:var(--bg);border-radius:16px;padding:26px 26px 22px;display:flex;flex-direction:column}
  .bct-hdr{display:flex;align-items:center;gap:13px;padding-bottom:16px;margin-bottom:18px;border-bottom:2px solid var(--line);position:relative}
  .bct-hdr::after{content:'';position:absolute;left:0;bottom:-2px;width:84px;height:2px;background:var(--acc)}
  .bct-bars{display:flex;gap:3px;align-items:center}
  .bct-bars i{width:5px;height:26px;background:var(--acc);border-radius:1px;transform:skewX(-12deg)}
  .bct-bars i:nth-child(2){height:20px;opacity:.6}.bct-bars i:nth-child(3){height:14px;opacity:.35}
  .bct-logo{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:38px;letter-spacing:.04em;line-height:.9;text-transform:uppercase}
  .bct-meta{margin-left:auto;text-align:right;line-height:1.35}
  .bct-meta b{display:block;font-family:'Saira Condensed',sans-serif;font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase}
  .bct-meta span{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}

  /* ── tabs (added) ─────────────────────────── */
  .tabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
  .tab{flex:1 1 calc(33.333% - 5px);text-align:center;background:var(--tile);border:1px solid var(--line);border-radius:11px;padding:10px;
    font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--mute);cursor:pointer}
  .tab.on{background:var(--acc);color:oklch(0.165 0.012 72);border-color:var(--acc)}
  .subtabs{display:flex;gap:7px;margin-bottom:13px}
  .subtab{flex:1;text-align:center;background:transparent;border:1px solid var(--line);border-radius:9px;padding:7px;
    font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);cursor:pointer}
  .subtab.on{border-color:var(--acc-d);color:var(--acc)}

  .bct-list{display:flex;flex-direction:column;gap:11px}
  .bct-card{display:grid;grid-template-columns:58px 1fr;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
  .bct-rail{background:linear-gradient(160deg,var(--card),var(--tile));position:relative;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line)}
  .bct-rail::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc)}
  .bct-rank{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:38px;line-height:.85;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .bct-rank b{display:block;font-size:8px;font-weight:700;letter-spacing:.18em;color:var(--faint);text-align:center;margin-bottom:3px}
  .bct-main{padding:13px 15px 14px;min-width:0}
  .bct-name{font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:25px;line-height:.98;text-transform:uppercase;letter-spacing:.01em}
  .bct-match{font-family:'Saira Condensed',sans-serif;font-weight:500;font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;margin-top:1px}
  .bct-bet{display:flex;align-items:center;margin:11px 0 12px;padding:7px 12px;border-radius:8px;border-left:4px solid}
  .bct-bet.bct-over{background:color-mix(in oklch,var(--over) 12%,transparent);border-color:var(--over)}
  .bct-bet.bct-under{background:color-mix(in oklch,var(--under) 12%,transparent);border-color:var(--under)}
  .bct-bet .bct-side{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.03em}
  .bct-over .bct-side{color:var(--over)}.bct-under .bct-side{color:var(--under)}
  .bct-bet .bct-ln{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:19px;margin-left:11px}
  .bct-bet .bct-proj{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
  .bct-bet .bct-proj b{color:var(--ink);font-weight:600}
  .bct-tiles{display:flex;gap:9px}
  .bct-tile{flex:1;background:var(--tile);border:1px solid var(--line);border-radius:10px;padding:9px 11px 10px;position:relative;overflow:hidden}
  .bct-tile.bct-best{border-color:var(--acc-d)}.bct-tile.bct-off{opacity:.45}
  .bct-tbk{display:flex;align-items:center;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;color:var(--mute);text-transform:uppercase}
  .bct-tdot{width:6px;height:6px;border-radius:50%;flex:0 0 auto;margin-right:6px}
  .bct-tdot.bct-dk{background:oklch(0.74 0.16 150)}.bct-tdot.bct-fd{background:oklch(0.66 0.16 250)}
  .bct-tdot.bct-pp{background:var(--acc)}
  .bct-tdot.bct-mgm{background:oklch(0.80 0.15 85)}.bct-tdot.bct-hr{background:oklch(0.62 0.21 350)}
  .bct-cmeta{margin-top:11px;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .bct-cmeta b{color:var(--acc-d);font-weight:600}
  .bct-trow{display:flex;align-items:baseline;margin-top:5px}
  .bct-tln{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:24px;line-height:.9;font-variant-numeric:tabular-nums}
  .bct-tpx{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:var(--acc);font-variant-numeric:tabular-nums;margin-left:9px}
  .bct-tpx.bct-na{color:var(--faint)}
  .bct-ribbon{position:absolute;top:0;right:0;font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--bg);background:var(--acc);padding:2px 8px;border-bottom-left-radius:8px}
  .bct-placed{border-color:var(--over)}
  .bct-betbtn{margin-left:auto;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase;background:transparent;color:var(--acc);border:1px solid var(--acc-d);border-radius:7px;padding:4px 10px;cursor:pointer}
  .bct-betbtn.done{color:var(--over);border-color:var(--over);cursor:default}
  .betform{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;margin-top:8px}
  .betform input,.betform select{width:100%;background:var(--tile);border:1px solid var(--line);border-radius:8px;padding:7px 8px;color:inherit;font:inherit;font-size:13px}
  .betform button{background:var(--acc);color:oklch(0.165 0.012 72);border:none;border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer}
  .betrow{display:flex;align-items:center;gap:6px;margin-top:8px}
  .betrow .res{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);border-radius:7px;padding:4px 9px;cursor:pointer;background:transparent;color:var(--mute)}
  .betrow .res.w{color:var(--over);border-color:var(--over)}.betrow .res.l{color:var(--under);border-color:var(--under)}
  .bct-placechip{display:inline-flex;align-items:center;gap:4px;margin-left:8px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--over);border:1px solid var(--over);border-radius:6px;padding:1px 6px;vertical-align:middle}
  .bct-foot{display:flex;align-items:center;justify-content:space-between;margin-top:18px;padding-top:13px;border-top:2px solid var(--line);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
  .bct-foot b{color:var(--acc-d);font-weight:600}
  .bct-foot a{color:var(--faint);text-decoration:none;cursor:pointer}
  .bct-empty{color:var(--mute);text-align:center;padding:40px 20px;font-family:'Saira Condensed',sans-serif;text-transform:uppercase;letter-spacing:.08em}
  .wc-note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:11px;
    font-family:'JetBrains Mono',monospace;font-size:10.5px;line-height:1.65;color:var(--mute);letter-spacing:.01em}
  .loading{text-align:center;padding:60px 20px;color:var(--mute);font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Loading…</div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL  = 'https://zuijmbyrwzixnhcaqgpl.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_64yRp9qL6lES2TGOItXeEg_UFtWQfJ2';

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById('app');

// (DK deep-link helper kept for future card use)
window.placeDK = (web) => {
  const m = (web || '').match(/\/event\/(\d+)/);
  if (!m) { window.location.href = web; return; }   // lobby / no event id -> web
  const appUrl = `dksb://sb/event/${m[1]}`;
  let left = false;
  const onHide = () => { left = true; };
  document.addEventListener('visibilitychange', onHide, { once: true });
  setTimeout(() => {
    document.removeEventListener('visibilitychange', onHide);
    if (!left && !document.hidden) window.location.href = web;   // app didn't take over
  }, 1200);
  window.location.href = appUrl;   // try the app first
};

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtLine = x => (x == null ? '' : (+x).toString());
const fmtOdds = x => (x == null ? '' : (x > 0 ? '+' + x : '' + x));
// Friends sign in with a simple username + password. Supabase is email-based,
// so the username is mapped to <username>@raya-hq.com under the hood — no real
// email is needed or sent (requires "Confirm email" OFF in Supabase Auth).
const USER_DOMAIN = '@raya-hq.com';
function authScreen(msg, cls) {
  app.innerHTML = `
    <div class="auth">
      <div class="mark">Raya</div>
      <div class="tag">Daily Brief</div>
      <p id="sub">Sign in with your username and password.</p>
      <input id="user" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="username" />
      <input id="pass" type="password" autocomplete="current-password" placeholder="password" />
      <button id="go">Sign in</button>
      <div class="switch">New here? <a id="toggle">Create an account</a></div>
      <div class="msg ${cls||''}" id="msg">${msg||''}</div>
    </div>`;
  const U = document.getElementById('user');
  const P = document.getElementById('pass');
  const btn = document.getElementById('go');
  const out = document.getElementById('msg');
  const tog = document.getElementById('toggle');
  const sub = document.getElementById('sub');
  let mode = 'signin';
  tog.onclick = () => {
    mode = mode === 'signin' ? 'signup' : 'signin';
    btn.textContent = mode === 'signin' ? 'Sign in' : 'Create account';
    tog.textContent = mode === 'signin' ? 'Create an account' : 'Have an account? Sign in';
    sub.textContent = mode === 'signin'
      ? 'Sign in with your username and password.'
      : 'Pick a username and password to create your account.';
    out.textContent = ''; out.className = 'msg';
  };
  btn.onclick = async () => {
    const u = U.value.trim().toLowerCase().replace(/[^a-z0-9_.-]/g, '');
    const p = P.value;
    if (!u || !p) { out.className='msg err'; out.textContent='Enter a username and password.'; return; }
    if (p.length < 6) { out.className='msg err'; out.textContent='Password must be at least 6 characters.'; return; }
    btn.disabled = true; out.className='msg'; out.textContent = mode === 'signup' ? 'Creating…' : 'Signing in…';
    const creds = { email: u + USER_DOMAIN, password: p };
    const { error } = mode === 'signup'
      ? await sb.auth.signUp(creds)
      : await sb.auth.signInWithPassword(creds);
    if (error) {
      out.className = 'msg err';
      out.textContent = /invalid login/i.test(error.message) ? 'Wrong username or password.' : error.message;
      btn.disabled = false;
    }
    // success -> onAuthStateChange fires -> render()
  };
  P.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });
}
// ── v9.0 (10/28): one tab. Bets → "Last Night" (real-money summary from raya_bets) | "Findings" (Raya Analyst). ──
let betsMode = 'night';   // 'night' | 'findings'
let findMode = 'open';    // 'open' (new+watching) | 'applied' | 'rejected' | 'all'

// Visible build stamp — bump on each deploy. Keep aligned with the service-worker cache name in sw.js.
const BUILD = 'v9.0 / 2026-10-28';

// Dollars per logged unit when a row's notes don't carry a "$" amount (Novig fills do: "$25.00 order …").
// Novig trader logs stake in 5-dollar units ($25 order = 5.0u), so 5 is the live default.
const UNIT_DOLLARS = 5;

const BOOK_LBL = { novig:'Novig', draftkings:'DraftKings', fanduel:'FanDuel', hardrock:'Hard Rock', betmgm:'BetMGM', caesars:'Caesars', thescore:'theScore' };
const RULE_LBL = { novig_nba_edge:'NBA Edge', novig_nfl_edge:'NFL Edge', novig_nfl_overs:'NFL ▲ Overs', novig_nhl_shots:'NHL Shots', novig_hr_shots:'NHL Shots (HR ref)',
                   edge_hr_shots:'NHL Shots · Hard Rock', nfl_overs:'NFL ▲ Overs', nfl_place:'NFL ✓ Place' };
const ruleLbl = r => RULE_LBL[r] || String(r || '').replace(/_/g, ' ');
const MKT_LBL = { player_assists:'AST', player_rebounds:'REB', player_points:'PTS', player_shots:'SOG', player_blocks:'BLK', receptions:'REC', receiving_yards:'REC YDS',
                  rushing_yards:'RUSH YDS', rushing_attempts:'RUSH ATT', rush_attempts:'RUSH ATT', passing_attempts:'PASS ATT', pass_attempts:'PASS ATT', completions:'COMP',
                  passing_yards:'PASS YDS', moneyline:'ML', spread:'SPREAD', handicap:'SPREAD', totals:'TOTAL', total:'TOTAL' };
const mktLbl = m => MKT_LBL[m] || String(m || '').replace(/_/g, ' ').toUpperCase();

// Dollars risked on a row: "$NN.NN" in notes wins (what Novig actually filled); otherwise units × UNIT_DOLLARS.
function betDollars(r) {
  const m = String(r.notes || '').match(/\$(\d+(?:\.\d+)?)/);
  if (m) return +m[1];
  return (+r.stake || 0) * UNIT_DOLLARS;
}
function betProfitDollars(r) {
  if (r.result !== 'win' && r.result !== 'loss') return 0;
  const stake = +r.stake || 0;
  return stake ? (+r.profit_units || 0) * (betDollars(r) / stake) : 0;
}
const money = x => (x < 0 ? '−$' : '+$') + Math.abs(x).toFixed(2);
const moneyPlain = x => '$' + Math.abs(x).toFixed(2);

// "Night" windows run 6 AM ET → 6 AM ET so a 10:57 PM fill lands on the night it was played.
function etNow() { return new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' })); }
function etOffsetMs() { return new Date() - etNow(); }     // UTC − ET wall clock, in ms
function nightWindow(daysBack) {
  const et = etNow();
  const start = new Date(et.getFullYear(), et.getMonth(), et.getDate(), 6, 0, 0, 0);   // today 06:00 ET (as wall clock)
  if (et.getHours() < 6) start.setDate(start.getDate() - 1);                              // before 6 AM: the night still running is "last night"
  start.setDate(start.getDate() - daysBack);
  const end = new Date(start); end.setDate(end.getDate() + 1);
  const off = etOffsetMs();
  return { start: new Date(+start + off), end: new Date(+end + off), label: start.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' }).toUpperCase() };
}
function tally(rows) {
  const t = { n: rows.length, w: 0, l: 0, p: 0, open: 0, risk: 0, net: 0, units: 0 };
  rows.forEach(r => {
    if (r.result === 'win') t.w++; else if (r.result === 'loss') t.l++; else if (r.result === 'push') t.p++; else t.open++;
    t.risk += betDollars(r); t.net += betProfitDollars(r); t.units += (+r.profit_units || 0);
  });
  return t;
}
function summaryTile(title, sub, t, big) {
  const col = t.net >= 0 ? 'var(--over)' : 'var(--under)';
  const stat = (lbl, val, c) => `<div style="display:flex;flex-direction:column;line-height:1.1;min-width:0">
      <span style="font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase">${lbl}</span>
      <span style="font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:${big ? 30 : 20}px;${c ? 'color:' + c : ''}">${val}</span></div>`;
  const settled = t.w + t.l;
  const pct = settled ? Math.round(100 * t.w / settled) + '%' : '--';
  return `<div class="bct-tile" style="margin-bottom:10px;padding:12px 14px 13px">
    <div class="bct-tbk" style="margin-bottom:9px">${title}${sub ? ` &middot; ${sub}` : ''}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:10px;align-items:end">
      ${stat('Bets', t.n + (t.open ? `<small style="font-size:11px;color:var(--mute);font-weight:600;margin-left:4px">${t.open} open</small>` : ''))}
      ${stat('Won &ndash; Lost', `${t.w}&ndash;${t.l}${t.p ? `<small style="font-size:11px;color:var(--mute);font-weight:600;margin-left:4px">${t.p}P</small>` : ''}<small style="font-size:11px;color:var(--mute);font-weight:600;margin-left:6px">${pct}</small>`)}
      ${stat(t.net >= 0 ? 'Made' : 'Lost', t.n ? money(t.net) : '--', t.n ? col : 'var(--mute)')}
    </div>
    <div class="bct-cmeta" style="margin-top:9px">Risked ${moneyPlain(t.risk)}${t.risk ? ` &middot; ROI <b style="color:${col}">${(t.net >= 0 ? '+' : '') + (100 * t.net / t.risk).toFixed(1)}%</b>` : ''} &middot; ${(t.units >= 0 ? '+' : '') + t.units.toFixed(2)}u</div>
  </div>`;
}
function betRow(r) {
  const col = r.result === 'win' ? 'var(--over)' : r.result === 'loss' ? 'var(--under)' : 'var(--mute)';
  const net = betProfitDollars(r);
  const res = r.result ? `<span style="color:${col};font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:17px;white-space:nowrap">${esc(r.result.toUpperCase())} ${r.result === 'push' ? '' : money(net)}</span>`
                       : `<span style="color:var(--mute);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase">open</span>`;
  const when = new Date(r.placed_at).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', timeZone:'America/New_York' });
  const game = (String(r.notes || '').match(/\b([A-Z]{2,4} @ [A-Z]{2,4})\s*$/) || [])[1] || r.matchup || '';
  return `<div class="bct-tile" style="padding:9px 12px">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline">
      <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:17px;text-transform:uppercase">${esc(r.player || r.matchup || '')}</span>
      ${res}</div>
    <div class="bct-cmeta" style="margin-top:3px">${esc(r.side || '')} ${r.line != null ? esc(String(r.line)) : ''} ${esc(mktLbl(r.market))} &middot; ${esc(BOOK_LBL[r.book] || r.book || '')} ${fmtOdds(r.price)} &middot; ${moneyPlain(betDollars(r))}${game ? ` &middot; ${esc(game)}` : ''} &middot; ${when} &middot; <b>${esc(ruleLbl(r.rule))}</b></div>
  </div>`;
}
function ruleBoard(rows) {
  const by = {};
  rows.forEach(r => { (by[r.rule] = by[r.rule] || []).push(r); });
  const keys = Object.keys(by).sort((a, b) => tally(by[b]).net - tally(by[a]).net);
  if (!keys.length) return '';
  const line = k => { const t = tally(by[k]); return `<div style="display:flex;justify-content:space-between;gap:8px;font-family:'JetBrains Mono',monospace;font-size:11px;padding:5px 0;border-top:1px solid var(--line)">
      <span>${esc(ruleLbl(k))}</span><span style="white-space:nowrap">${t.w}&ndash;${t.l}${t.open ? ` <span style="color:var(--faint)">+${t.open} open</span>` : ''} &middot; <b style="color:${t.net >= 0 ? 'var(--over)' : 'var(--under)'}">${money(t.net)}</b></span></div>`; };
  return `<div class="bct-tile" style="margin-bottom:10px"><div class="bct-tbk">By rule &middot; all time</div>${keys.map(line).join('')}</div>`;
}

function shell(metaTitle, metaSub, body, footL, footR) {
  const subtabs = betsMode === 'findings' ? `<div class="subtabs">
      <div class="subtab ${findMode==='open'?'on':''}" data-find="open">Open</div>
      <div class="subtab ${findMode==='applied'?'on':''}" data-find="applied">Applied</div>
      <div class="subtab ${findMode==='rejected'?'on':''}" data-find="rejected">Rejected</div>
      <div class="subtab ${findMode==='all'?'on':''}" data-find="all">All</div>
    </div>` : '';
  app.innerHTML = `<div class="bct">
    <div class="bct-hdr">
      <div class="bct-bars"><i></i><i></i><i></i></div>
      <div class="bct-logo">Raya</div>
      <div class="bct-meta"><b>${metaTitle}</b><span>${metaSub}</span></div>
    </div>
    <div class="tabs">
      <div class="tab on" data-view="bets" style="flex:1 1 100%">Bets</div>
    </div>
    <div class="subtabs">
      <div class="subtab ${betsMode==='night'?'on':''}" data-bets="night" style="font-size:12px;padding:9px">Last Night</div>
      <div class="subtab ${betsMode==='findings'?'on':''}" data-bets="findings" style="font-size:12px;padding:9px">Findings</div>
    </div>
    ${subtabs}
    <div class="bct-list" id="list">${body}</div>
    <div class="bct-foot"><span>${footL}${footL?' &middot; ':''}<b>${BUILD}</b></span>
      <span>${footR} &middot; <a id="signout">Sign out</a></span></div>
  </div>`;
  app.querySelectorAll('.subtab').forEach(t => t.onclick = () => { if (t.dataset.bets) { betsMode = t.dataset.bets; } else if (t.dataset.find) { findMode = t.dataset.find; } render(); });
  const so = document.getElementById('signout');
  if (so) so.onclick = async () => { await sb.auth.signOut(); route(); };
}

async function render() {
  app.innerHTML = `<div class="loading">Loading…</div>`;
  if (betsMode === 'night') {
    // Real money only: confirmed rows (Novig trader fills + anything Brandon confirmed by hand). Auto-logged push rows are unconfirmed and stay out.
    const { data, error } = await sb.from('raya_bets').select('*').eq('confirmed', true).neq('rule', 'test_button').order('placed_at', { ascending: false }).limit(1000);
    if (error) return shell('Bets','', `<div class="bct-empty">Couldn't load.<br>${esc(error.message)}</div>`, '', '');
    const all = (data || []).filter(r => !/ignore|test fill/i.test(r.notes || ''));
    const inWin = (w, r) => { const t = new Date(r.placed_at); return t >= w.start && t < w.end; };
    const last = nightWindow(1), cur = nightWindow(0);
    const lastRows = all.filter(r => inWin(last, r));
    const curRows = all.filter(r => inWin(cur, r));
    const week = all.filter(r => new Date(r.placed_at) >= new Date(+last.start - 6 * 86400000));
    let body = summaryTile('Last night', last.label, tally(lastRows), true);
    if (curRows.length) body += summaryTile('Tonight so far', cur.label, tally(curRows), false);
    body += summaryTile('Last 7 nights', '', tally(week), false);
    body += summaryTile('All time', `since ${all.length ? new Date(all[all.length - 1].placed_at).toLocaleDateString('en-US', { month:'short', day:'numeric' }) : '--'}`, tally(all), false);
    body += ruleBoard(all);
    const hdr = t => `<div class="bct-tbk" style="padding:10px 4px 6px;letter-spacing:.08em">${t}</div>`;
    body += hdr(`LAST NIGHT'S BETS &middot; ${lastRows.length}`);
    body += lastRows.length ? lastRows.map(betRow).join('') : '<div class="bct-empty" style="padding:18px">No real-money bets last night.</div>';
    if (curRows.length) body += hdr(`TONIGHT &middot; ${curRows.length}`) + curRows.map(betRow).join('');
    const t = tally(all);
    shell('Bets', 'Real Money &middot; Novig + confirmed', body, `${all.length} Bets`, `All time <b style="color:${t.net >= 0 ? 'var(--over)' : 'var(--under)'}">${money(t.net)}</b>`);
  } else {
    // Raya Analyst (tools/raya_analyst.py, Mondays 8 AM): every track + every cut that cleared the noise bar. Brandon decides here.
    const { data, error } = await sb.from('raya_findings').select('*').limit(1000);
    if (error) return shell('Findings','', `<div class="bct-empty">Couldn't load.<br>${esc(error.message)}</div>`, '', '');
    const all = data || [];
    const sg = x => (x >= 0 ? '+' : '') + (+x).toFixed(1);
    const col = u => (u >= 0 ? 'var(--over)' : 'var(--under)');
    const tracks = all.filter(r => r.kind === 'track').sort((a, b) => (b.units || 0) - (a.units || 0));
    const tline = tracks.map(r => `<div style="display:flex;justify-content:space-between;gap:8px;font-family:'JetBrains Mono',monospace;font-size:11px;padding:5px 0;border-top:1px solid var(--line)"><span>${esc(r.track)}</span><span style="white-space:nowrap">${r.wins}&ndash;${r.losses} &middot; <b style="color:${col(r.units)}">${sg(r.units)}u</b> &middot; ${sg(r.roi)}% &middot; <b>${esc(String(r.verdict || '').toUpperCase())}</b></span></div>`).join('');
    const lastRun = all.length ? new Date(Math.max(...all.map(r => +new Date(r.last_seen || 0)))) : null;
    const board = `<div class="bct-tile" style="margin-bottom:10px"><div class="bct-tbk">Tracks &middot; ${tracks.length} &middot; ${lastRun ? 'run ' + lastRun.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : ''}</div>${tline || '<div class="bct-cmeta" style="padding:6px 0">No analyst run yet.</div>'}</div>`;
    let cuts = all.filter(r => r.kind === 'drag' || r.kind === 'lift');
    if (findMode === 'open') cuts = cuts.filter(r => r.status === 'new' || r.status === 'watching');
    else if (findMode !== 'all') cuts = cuts.filter(r => r.status === findMode);
    const confRank = { high: 0, medium: 1, low: 2 };
    cuts.sort((a, b) => (confRank[a.confidence] ?? 3) - (confRank[b.confidence] ?? 3) || Math.abs(b.z || 0) - Math.abs(a.z || 0));
    const chip = (t, c) => `<span class="bct-tpx" style="color:${c};border:1px solid ${c};border-radius:6px;padding:1px 6px;font-size:10px">${t}</span>`;
    const cardHTML = cuts.map(r => {
      const cc = r.confidence === 'high' ? 'var(--over)' : r.confidence === 'medium' ? 'var(--acc)' : 'var(--mute)';
      const st = r.status === 'applied' ? 'var(--over)' : r.status === 'rejected' ? 'var(--under)' : r.status === 'watching' ? 'var(--acc)' : 'var(--mute)';
      const btn = (lbl, v) => `<button class="res ${r.status === v ? 'w' : ''}" data-fkey="${esc(r.key)}" data-fstatus="${v}">${lbl}</button>`;
      return `<div class="bct-card"><div class="bct-rail"><div class="bct-rank" style="font-size:16px"><b>${r.kind === 'drag' ? '&minus;' : '&#9650;'}</b>${esc(r.kind)}</div></div>
        <div class="bct-main"><div class="bct-name" style="font-size:17px">${esc(r.track)}</div>
        <div class="bct-match">${esc(r.dim)} = <b>${esc(r.value)}</b> &middot; ${r.wins}&ndash;${r.losses} &middot; <b style="color:${col(r.units)}">${sg(r.units)}u</b> &middot; ${sg(r.roi)}% &middot; n=${r.n} &middot; ${r.weeks_pos}/${r.weeks} wks</div>
        <div class="bct-cmeta" style="margin-top:4px">${esc(r.action)}</div>
        <div class="bct-cmeta" style="margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">${chip(String(r.confidence || '').toUpperCase(), cc)} ${chip(String(r.status || '').toUpperCase(), st)}
          <span class="betrow" style="margin:0 0 0 auto">${btn('Watch', 'watching')}${btn('Apply', 'applied')}${btn('Reject', 'rejected')}</span></div></div></div>`;
    }).join('');
    shell('Findings', 'Raya Analyst &middot; Nothing changes until you apply it', board + (cardHTML || `<div class="bct-empty">${findMode === 'open' ? 'No open findings. Next analyst run is Monday 8 AM.' : 'Nothing here.'}</div>`),
          `${cuts.length} Findings`, 'Runs <b>Mon 8 AM ET</b>');
    // two-tap safety: first tap arms the button ("Sure?"), a second tap within 5s commits; it resets on its own otherwise
    app.querySelectorAll('[data-fkey]').forEach(b => { const label = b.textContent; b.onclick = async () => {
      if (!b.dataset.armed) {
        b.dataset.armed = '1'; b.textContent = 'Sure? ' + label; b.style.borderColor = 'var(--acc)'; b.style.color = 'var(--acc)';
        setTimeout(() => { if (b.dataset.armed) { delete b.dataset.armed; b.textContent = label; b.style.borderColor = ''; b.style.color = ''; } }, 5000);
        return;
      }
      delete b.dataset.armed; b.textContent = '…';
      const { error } = await sb.from('raya_findings').update({ status: b.dataset.fstatus }).eq('key', b.dataset.fkey);
      if (error) { b.textContent = 'Err'; console.error(error); return; }
      render();
    }; });
  }
}

async function route() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) render(); else authScreen();
}

sb.auth.onAuthStateChange((_e, session) => { if (session) render(); });
route();

/* ── keep the brief fresh on Home-Screen reopen ─────────────────────────
   iOS freezes a standalone PWA and restores it without re-fetching, so we
   re-pull the current view whenever the app returns to the foreground. ── */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

let _lastFresh = Date.now();
async function _resumeRefresh(force) {
  if (!force && document.visibilityState !== 'visible') return;
  if (!force && Date.now() - _lastFresh < 15000) return;
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;
  _lastFresh = Date.now();
  render();
}
document.addEventListener('visibilitychange', () => _resumeRefresh(false));
window.addEventListener('focus', () => _resumeRefresh(false));
window.addEventListener('pageshow', (e) => { if (e.persisted) _resumeRefresh(true); });
</script>
</body>
</html>
